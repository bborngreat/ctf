<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Tasks</title>
    
    <script src="confetti.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <header class="app-header">
            <h1 class="app-title">Focus</h1>
            <p class="app-subtitle" id="task-counter">Dynamic loading...</p>
        </header>

        <section class="task-section">
            <div id="todo-list" class="todo-list"></div>
        </section>
    </main>

    <button id="fab-add" class="fab-btn fab-left" aria-label="Add new task">
        <svg class="plus-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <button id="fab-clear" class="fab-btn fab-right" aria-label="Clear and reset all tasks">
        <svg class="trash-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 7L18.1327 19.1425C18.0579 20.1891 17.187 21 16.1378 21H7.86224C6.81296 21 5.94208 20.1891 5.86732 19.1425L5 7M10 11V17M14 11V17M15 7V4C15 3.44772 14.5523 3 14 3H10C9.44772 3 9 3.44772 9 4V7M4 7H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <div id="input-modal" class="modal-overlay">
        <div class="modal-content input-card">
            <h3 class="modal-title">New Task</h3>
            <input type="text" id="task-input" placeholder="What's on your mind?" autocomplete="off" maxlength="80">
            <div class="modal-actions">
                <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
                <button id="modal-submit" class="btn btn-primary">Create</button>
            </div>
        </div>
    </div>

    <div id="celebration-modal" class="modal-overlay celebration-overlay">
        <div class="modal-content celebration-card">
            <div class="celebration-emoji">🥳</div>
            <p id="celebration-text" class="celebration-text"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
